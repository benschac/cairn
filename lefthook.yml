# Each commit runs the fast checks; each push needs `pnpm check` to have passed at the top of the stack.
# Do not skip either hook: see AGENTS.md.
pre-commit:
  commands:
    check:
      run: pnpm check:commit

# A commit on a task's branch carries its Cairn-Task and Cairn-Section trailers.
commit-msg:
  commands:
    trailers:
      run: node scripts/trailers/commit-msg.ts {1}

pre-push:
  commands:
    checked:
      run: node scripts/gate/gate.ts pre-push
      use_stdin: true
