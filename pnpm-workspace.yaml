packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@effect/vitest": 4.1.6
  "@xstate/effect": 1.0.0-beta.3
  "@xstate/test": 2.0.0-beta.3
  effect: 4.1.6
  fast-check: 4.11.0
  vitest: 5.1.1
  xstate: 6.0.0-beta.5

# Effect UI is not on npm. Both packages come from the pkg.pr.new snapshot of
# one commit of Effect-TS/ui's main, the same commit for both; moving to a
# newer one is its own change (see spec.viewer.effect-ui.spike).
catalogs:
  effect-ui:
    "@effect/ui": https://pkg.pr.new/Effect-TS/ui/@effect/ui@87a704b
    "@effect/ui-kit": https://pkg.pr.new/Effect-TS/ui/@effect/ui-kit@87a704b

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

minimumReleaseAgeExclude:
  - "@effect/ai-anthropic@4.1.6"
  - "@effect/ai-openai-compat@4.1.6"
  - "@effect/ai-openai@4.1.6"
  - "@effect/ai-openrouter@4.1.6"
  - "@effect/ai-typesafe@4.1.6"
  - "@effect/platform-browser@4.1.6"
  - "@effect/platform-node-shared@4.1.6"
  - "@effect/platform-node@4.1.6"
  - "@effect/sql-sqlite-node@4.1.6"
  - "@effect/vitest@4.1.6"
  - effect@4.1.6
