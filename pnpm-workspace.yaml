packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@effect/vitest": 4.1.6
  "@xstate/effect": 1.0.0-beta.3
  "@xstate/test": 2.0.0-beta.3
  effect: 4.1.6
  fast-check: 4.11.0
  vitest: 5.1.1
  xstate: 6.0.0-beta.5

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

# Foldkit's Scene harness re-rendered the whole view after every step and gave
# each render a fresh boundary registry, so lazy views never hit. The patch
# reuses the view after a step that leaves the Model unchanged and keeps one
# registry per scene. Sent upstream from benschac/foldkit (branch
# perf/scene-reuse-renders); drop the patch once a Foldkit release has it.
patchedDependencies:
  foldkit@0.171.0: patches/foldkit@0.171.0.patch

minimumReleaseAgeExclude:
  - "@effect/ai-anthropic@4.1.6"
  - "@effect/ai-openai-compat@4.1.6"
  - "@effect/ai-openai@4.1.6"
  - "@effect/ai-openrouter@4.1.6"
  - "@effect/ai-typesafe@4.1.6"
  - "@effect/platform-browser@4.1.6"
  - "@effect/platform-node-shared@4.1.6"
  - "@effect/platform-node@4.1.6"
  - "@effect/sql-sqlite-node@4.1.6"
  - "@effect/vitest@4.1.6"
  - effect@4.1.6
